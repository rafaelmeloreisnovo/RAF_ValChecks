name: RAF ValChecks
description: Fail-closed pinned-manifest and receipt contract preflight (not a test runner)
inputs:
  manifest:
    description: Path to a JSON or supported strict-YAML validation manifest
    required: true
    default: .raf/validation.yml
  receipt:
    description: Optional previously validated JSON receipt
    required: false
    default: ""
  trusted_receipt_sha256:
    description: Trusted 64-character SHA-256 digest of receipt bytes (required to reuse)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: sh
      env:
        RAF_MANIFEST: ${{ inputs.manifest }}
        RAF_RECEIPT: ${{ inputs.receipt }}
        RAF_TRUSTED_RECEIPT_SHA256: ${{ inputs.trusted_receipt_sha256 }}
      run: sh "${{ github.action_path }}/bin/raf-valcheck.sh"
