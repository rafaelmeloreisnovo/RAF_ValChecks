name: RAF ValChecks contract tests
on:
  pull_request:
    paths:
      - 'action.yml'
      - 'bin/**'
      - 'rafvalchecks/**'
      - 'docs/**'
      - 'examples/**'
      - 'schemas/**'
      - 'tests/**'
      - '.github/workflows/contract-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: valchecks-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24, pinned
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 2 # exact commit + parent; intentionally per-commit, not whole PR ancestry
      - name: Assert exact source HEAD (not PR merge ref)
        shell: sh
        env:
          RAF_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$RAF_EXPECTED_HEAD"
          printf 'head_verified=%s\n' "$RAF_EXPECTED_HEAD"
      - name: Audit verified local Git delta and negative coverage
        shell: sh
        run: |
          # Expected conservative result: this change modifies control-plane
          # files. A typed uncertainty is correct; it must never yield skip.
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          base = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'git-impact.json'
          args = [sys.executable, 'bin/raf_mvp.py', 'git-impact',
                  '--topology', 'examples/topology.mvp.json',
                  '--workspace', '.', '--routes', 'examples/change-routes.v1.json',
                  '--base', base, '--head', head]
          result = subprocess.run(args, capture_output=True, text=True, check=False)
          assert result.returncode in (0, 1), result.stderr
          data = json.loads(result.stdout)
          assert data['head'] == head and data['claim_allowed'] is False, data
          assert data['impact_advisory']['change_source_verified'] is True, data
          assert data['runtime_skipping_authorized'] is False, data
          assert data['independent_route_authority_verified'] is False, data
          if data['status'] == 'TOKEN_VAZIO':
              assert result.returncode == 1 and not data['impact_advisory']['unaffected_candidates']
          else:
              assert result.returncode == 0 and data['status'] == 'PLAN_ONLY'
          target.write_text(result.stdout)
          print('git_impact_status=' + data['status'])
          print('changed_paths=' + str(len(data['changed_paths'])))
          print('anomaly_tokens=' + ','.join(data['anomaly_tokens']))
          PY
      - name: Compile and run negative contract cases
        shell: sh
        run: |
          python3 -m compileall -q bin rafvalchecks
          python3 -m unittest discover -s tests -v
      - name: Falsify temporal unknowns and false-positive paths
        shell: sh
        run: |
          python3 bin/raf_mvp.py temporal --workspace . --events examples/temporal-observations.v1.json > "$RUNNER_TEMP/temporal.json"
          python3 - <<'PYCODE'
          import json, os, pathlib
          r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'temporal.json').read_text())
          assert r['status']=='OBSERVATION_ONLY' and r['coverage']['eligible']==12
          assert r['claim_allowed'] is False and r['causal_claim_allowed'] is False
          assert r['runtime_skipping_authorized'] is False
          assert r['external_source_trust_verified'] is False
          assert r['cascade_candidates']
          print('temporal_status='+r['status'])
          print('hypotheses='+str(len(r['hypotheses'])))
          print('typed_voids='+str(len(r['typed_voids'])))
          PYCODE
      - name: Generate manifest for the exact checked-out commit
        shell: sh
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          manifest = {
              'project': {'name': 'RAF_ValChecks', 'repository': os.environ['GITHUB_REPOSITORY'], 'source_commit': sha},
              'dependencies': [],
              'checks': ['action_entrypoint'],
              'policy': {'updates': 'observe_only', 'claim_allowed': False,
                         'reuse_receipts': False, 'recompute': 'impact_cone_only',
                         'impact_scope': ['contract_preflight']}
          }
          pathlib.Path('.raf').mkdir(exist_ok=True)
          pathlib.Path('.raf/validation.json').write_text(json.dumps(manifest), encoding='utf-8')
          PY
      - name: Execute composite Action positive path
        uses: ./
        with:
          manifest: .raf/validation.json
      - name: Reject an invalid source commit via Action entrypoint
        shell: sh
        run: |
          python3 - <<'PY'
          import json, pathlib
          doc = json.loads(pathlib.Path('.raf/validation.json').read_text())
          doc['project']['source_commit'] = '0' * 40
          pathlib.Path('.raf/invalid.json').write_text(json.dumps(doc), encoding='utf-8')
          PY
          if RAF_MANIFEST=.raf/invalid.json sh bin/raf-valcheck.sh > .raf/rejected.log; then
            printf '%s\n' 'invalid manifest was accepted' >&2
            exit 1
          fi
          grep -q '^result=BLOCKED$' .raf/rejected.log
          grep -q '^token=SOURCE_COMMIT_INVALID$' .raf/rejected.log
      - name: Exercise recursive MVP against exact checkout SHA
        shell: sh
        run: |
          python3 bin/raf_mvp.py plan --topology examples/topology.mvp.json > .raf/plan.json
          python3 bin/raf_mvp.py run --topology examples/topology.mvp.json --manifest .raf/validation.json --output .raf/mvp-receipt.json > .raf/mvp-result.json
          python3 - <<'PY'
          import json, pathlib
          a = json.loads(pathlib.Path('.raf/mvp-receipt.json').read_text())
          assert a['result'] == 'PASS_SCOPED', a
          assert a['source_identity_verified'] is True, a
          assert a['claim_allowed'] is False
          assert a['counts']['void'] >= 1
          assert all(v['kind']=='TOKEN_VAZIO' and v['value'] is None for v in a['typed_voids'])
          PY
      - name: Exercise MVP composite-action entrypoint
        uses: ./
        with:
          mode: mvp
          manifest: .raf/validation.json
          topology: examples/topology.mvp.json
      - name: Audit impact cone without executing or skipping checks
        shell: sh
        run: |
          python3 bin/raf_mvp.py impact --topology examples/topology.mvp.json --changed model > .raf/impact.json
          python3 bin/raf_mvp.py impact --topology examples/topology.mvp.json --changed unknown_remote_scope > .raf/impact-unknown.json
          python3 - <<'PY'
          import json, pathlib
          known=json.loads(pathlib.Path('.raf/impact.json').read_text())
          unknown=json.loads(pathlib.Path('.raf/impact-unknown.json').read_text())
          a=known['impact_advisory']
          assert known['executions'] == 0 and known['claim_allowed'] is False
          assert a['status'] == 'PLAN_ONLY' and a['runtime_skipping_authorized'] is False
          assert {'relative', 'knowledge', 'root', 'manifest', 'source'} <= set(a['affected'])
          assert 'rollback' in a['unaffected_candidates']
          u=unknown['impact_advisory']
          assert u['status'] == 'TOKEN_VAZIO' and u['unaffected_candidates'] == []
          assert u['typed_void']['value'] is None
          PY
