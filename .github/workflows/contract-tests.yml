name: RAF ValChecks contract tests
on:
  pull_request:
    paths:
      - 'action.yml'
      - 'bin/**'
      - 'examples/**'
      - 'schemas/**'
      - 'tests/**'
      - '.github/workflows/contract-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: valchecks-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, pinned
        with:
          persist-credentials: false
      - name: Compile and run negative contract cases
        shell: sh
        run: |
          python3 -m py_compile bin/raf_valcheck.py
          python3 -m unittest discover -s tests -v
